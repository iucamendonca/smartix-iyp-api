name: Testes da API
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r api/requirements-dev.txt
      - name: Verificar sintaxe
        run: python -m compileall -q api/app
      - name: Executar testes
        run: cd api && PYTHONPATH=. python -m pytest -q
